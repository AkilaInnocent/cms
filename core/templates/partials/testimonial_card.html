{% load core_extras static %}
<div class="card border-0 shadow-soft rounded-5 overflow-hidden bg-white">
    <div class="card-body p-4 p-lg-5 text-center">
        <img src="{% if testimonial.image %}{{ testimonial.image.url }}{% else %}{% static 'core/images/avatar-fallback.svg' %}{% endif %}" alt="{{ testimonial.name }}" class="testimonial-avatar rounded-circle mb-3" loading="lazy">
        <div class="d-flex justify-content-center gap-1 text-warning mb-3" aria-label="{{ testimonial.rating }} out of 5 stars">
            {% for _ in testimonial.rating|star_range %}
                <i class="bi bi-star-fill"></i>
            {% endfor %}
        </div>
        <blockquote class="blockquote mb-4">
            <p class="mb-0">“{{ testimonial.message }}”</p>
        </blockquote>
        <footer>
            <cite class="fw-semibold text-dark text-decoration-none">{{ testimonial.name }}</cite>
        </footer>
    </div>
</div>
