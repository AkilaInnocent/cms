<div class="service-card card border-0 shadow-soft rounded-5 w-100 overflow-hidden">
    <img src="{{ service.image.url }}" class="card-img-top service-image" alt="{{ service.title }}" loading="lazy">
    <div class="card-body p-4">
        <div class="service-icon-wrap mb-3">
            <span class="service-icon">
                <i class="{{ service.icon|default:'bi bi-tools' }}"></i>
            </span>
        </div>
        <h3 class="h4">{{ service.title }}</h3>
        <p class="text-secondary mb-0">{{ service.description }}</p>
    </div>
</div>
